<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS - Jalupang Teknik</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <style>
        body { background: #f5f7fa; }
        .card { transition: all 0.3s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        #quill-editor {
            min-height: 250px;
            max-height: 400px;
            overflow-y: auto;
            background: white;
            border-radius: 0 0 0.5rem 0.5rem;
        }
        .ql-toolbar {
            border-radius: 0.5rem 0.5rem 0 0;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-bottom: none;
        }
        .ql-container {
            border: 1px solid #e5e7eb;
            border-radius: 0 0 0.5rem 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .ql-editor { min-height: 200px; }

        .tab-button {
            padding: 12px 24px;
            border-radius: 12px 12px 0 0;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid transparent;
            border-bottom: none;
            cursor: pointer;
        }
        .tab-button.active {
            background: white;
            color: #15803d;
            border-color: #e5e7eb;
        }
        .tab-button:not(.active) {
            color: #6b7280;
            background: transparent;
        }
        .tab-button:not(.active):hover {
            color: #15803d;
            background: rgba(255,255,255,0.5);
        }

        .toast-notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.875rem;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: opacity 0.3s;
        }

        .editing-indicator {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #92400e;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="max-w-6xl mx-auto px-4 py-10">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">📝 CMS Jalupang Teknik</h1>
            <p class="text-gray-500 text-sm">Kelola artikel dan produk website</p>
        </div>
        <a href="index.html" class="text-green-600 hover:text-green-800 text-sm font-medium">
            <i class="fas fa-arrow-left"></i> Kembali ke Website
        </a>
    </div>

    <!-- TAB NAVIGATION -->
    <div class="flex gap-2 border-b border-gray-200">
        <button class="tab-button active" data-tab="tab-artikel" onclick="switchTab('tab-artikel')">
            <i class="fas fa-newspaper"></i> Artikel
        </button>
        <button class="tab-button" data-tab="tab-produk" onclick="switchTab('tab-produk')">
            <i class="fas fa-box"></i> Produk
        </button>
    </div>

    <!-- ============================================================ -->
    <!-- TAB: ARTIKEL -->
    <!-- ============================================================ -->
    <div id="tab-artikel" class="tab-content">
        
        <div class="bg-white rounded-2xl shadow-md p-6 my-6 card">
            <h2 class="text-xl font-bold text-gray-700 mb-4" id="artikel-form-title">➕ Tambah Artikel Baru</h2>
            
            <div id="artikel-edit-indicator" class="hidden editing-indicator">
                <span><i class="fas fa-edit"></i> Mode Edit — Artikel #<span id="artikel-edit-id"></span></span>
                <button onclick="cancelEditArtikel()" class="text-xs underline">Batalkan</button>
            </div>
            
            <form id="cms-form" class="space-y-4">
                <input type="hidden" id="cms-id" />
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul Artikel *</label>
                    <input type="text" id="cms-title" required 
                           class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none"
                           placeholder="Masukkan judul artikel..." />
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Konten Artikel *</label>
                    <div id="quill-editor"></div>
                    <input type="hidden" id="cms-content" required />
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">URL Gambar (opsional)</label>
                    <input type="url" id="cms-image" 
                           class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none"
                           placeholder="https://example.com/gambar.jpg" />
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Publikasi</label>
                    <div class="flex flex-wrap items-center gap-3">
                        <input type="date" id="cms-date" 
                               class="flex-1 min-w-[180px] px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" />
                        <button type="button" id="cms-date-today" 
                                class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition-all text-sm">
                            <i class="fas fa-calendar-day"></i> Hari Ini
                        </button>
                        <span class="text-xs text-gray-400">Kosongkan = otomatis hari ini</span>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-4 items-center">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select id="cms-status" class="px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
                            <option value="publish">Publish</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                    
                    <button type="submit" id="cms-submit-btn"
                            class="mt-6 px-6 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-all shadow-md hover:shadow-lg">
                        <i class="fas fa-save"></i> Simpan Artikel
                    </button>
                    
                    <button type="button" id="cms-clear-btn"
                            class="mt-6 px-6 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition-all">
                        <i class="fas fa-undo"></i> Reset
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 card">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700">📄 Daftar Artikel</h2>
                <button onclick="loadArticles()" class="text-sm text-green-600 hover:text-green-800 font-medium">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div id="cms-article-list" class="space-y-3">
                <p class="text-gray-400 text-sm">Memuat data...</p>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TAB: PRODUK -->
    <!-- ============================================================ -->
    <div id="tab-produk" class="tab-content hidden">
        
        <div class="bg-white rounded-2xl shadow-md p-6 my-6 card">
            <h2 class="text-xl font-bold text-gray-700 mb-4" id="produk-form-title">➕ Tambah Produk Baru</h2>
            
            <div id="produk-edit-indicator" class="hidden editing-indicator">
                <span><i class="fas fa-edit"></i> Mode Edit — Produk #<span id="produk-edit-id"></span></span>
                <button onclick="cancelEditProduk()" class="text-xs underline">Batalkan</button>
            </div>
            
            <form id="produk-form" class="space-y-4">
                <input type="hidden" id="produk-id" />
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Produk *</label>
                        <input type="text" id="produk-nama" required 
                               class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none"
                               placeholder="Contoh: Traktor Tangan" />
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kategori *</label>
                        <select id="produk-kategori" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
                            <option value="Mesin">Mesin</option>
                            <option value="Jasa">Jasa</option>
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Harga</label>
                        <input type="number" id="produk-harga" 
                               class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none"
                               placeholder="Contoh: 15000000" />
                        <p class="text-xs text-gray-400 mt-1">Kosongkan jika "Hubungi Kami"</p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL Gambar</label>
                        <input type="url" id="produk-gambar" 
                               class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none"
                               placeholder="https://example.com/gambar.jpg" />
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                    <textarea id="produk-deskripsi" rows="3"
                              class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none resize-y"
                              placeholder="Deskripsi singkat produk..."></textarea>
                </div>
                
                <div class="flex flex-wrap gap-4 items-center">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select id="produk-status" class="px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
                            <option value="publish">Publish</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                    
                    <button type="submit" id="produk-submit-btn"
                            class="mt-6 px-6 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-all shadow-md hover:shadow-lg">
                        <i class="fas fa-save"></i> Simpan Produk
                    </button>
                    
                    <button type="button" id="produk-clear-btn"
                            class="mt-6 px-6 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition-all">
                        <i class="fas fa-undo"></i> Reset
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 card">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700">📦 Daftar Produk</h2>
                <button onclick="loadProducts()" class="text-sm text-green-600 hover:text-green-800 font-medium">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div id="cms-produk-list" class="space-y-3">
                <p class="text-gray-400 text-sm">Memuat data...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbyQAKZs4rZouzb4TRyi6cWkFy2Mj5vIF4qlDdrzAu0HfqONxSp3Qo8YnpAQCaJ4WIBy/exec';

    // Cache data (agar edit tidak perlu fetch ulang)
    let cacheArticles = [];
    let cacheProducts = [];

    // ============================================================
    // TOAST NOTIFICATION
    // ============================================================
    function showToast(message) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();
        
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }

    // ============================================================
    // TAB SWITCH
    // ============================================================
    function switchTab(tabId) {
        document.querySelectorAll('.tab-button').forEach(function(btn) {
            btn.classList.remove('active');
        });
        document.querySelector('[data-tab="' + tabId + '"]').classList.add('active');
        
        document.querySelectorAll('.tab-content').forEach(function(content) {
            content.classList.add('hidden');
        });
        document.getElementById(tabId).classList.remove('hidden');
        
        if (tabId === 'tab-produk') {
            loadProducts();
        } else if (tabId === 'tab-artikel') {
            loadArticles();
        }
    }

    // ============================================================
    // QUILL EDITOR
    // ============================================================
    var quill = new Quill('#quill-editor', {
        theme: 'snow',
        placeholder: 'Tulis konten artikel di sini...',
        modules: {
            toolbar: [
                [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['blockquote', 'code-block'],
                ['link', 'image', 'video'],
                ['clean']
            ]
        }
    });

    // ============================================================
    // ============ ARTIKEL =======================================
    // ============================================================

    async function loadArticles() {
        const listContainer = document.getElementById('cms-article-list');
        listContainer.innerHTML = '<p class="text-gray-400 text-sm">Memuat data...</p>';
        
        try {
            const response = await fetch(API_URL + '?type=artikel');
            if (!response.ok) throw new Error('Gagal memuat data');
            const articles = await response.json();
            cacheArticles = articles;
            
            if (articles.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-400 text-sm">Belum ada artikel.</p>';
                return;
            }
            
            let html = '';
            articles.forEach((article, index) => {
                const statusColor = article.status === 'publish' ? 'green' : 'yellow';
                const statusText = article.status === 'publish' ? 'Published' : 'Draft';
                const contentPreview = article.content ? article.content.replace(/<[^>]*>/g, '').substring(0, 80) + '...' : '(kosong)';
                const date = article.created_at || 'Tanggal tidak tersedia';
                const articleId = article.id || index + 1;
                
                html += `
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100 hover:border-green-200 transition-colors">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-sm font-bold text-gray-400">#${articleId}</span>
                                <span class="text-sm font-semibold text-gray-800 truncate">${article.title || 'Tanpa Judul'}</span>
                            </div>
                            <div class="text-xs text-gray-400 truncate mt-0.5">${contentPreview}</div>
                            <div class="text-xs text-gray-400 mt-0.5">
                                <i class="far fa-calendar-alt"></i> ${date}
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0 ml-4">
                            <span class="px-2 py-0.5 text-xs rounded-full bg-${statusColor}-100 text-${statusColor}-700 font-medium">${statusText}</span>
                            <button onclick="editArticle('${articleId}')" class="text-blue-400 hover:text-blue-600 transition-colors text-sm" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteArticle('${articleId}')" class="text-red-400 hover:text-red-600 transition-colors text-sm" title="Hapus">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            listContainer.innerHTML = html;
            
        } catch (error) {
            console.error('Error loading articles:', error);
            listContainer.innerHTML = '<p class="text-red-500 text-sm">❌ Gagal memuat data artikel.</p>';
        }
    }

    // EDIT ARTIKEL - Isi form dengan data yang ada
    function editArticle(id) {
        const article = cacheArticles.find(a => String(a.id) === String(id));
        if (!article) {
            showToast('❌ Artikel tidak ditemukan');
            return;
        }
        
        // Isi form
        document.getElementById('cms-id').value = article.id;
        document.getElementById('cms-title').value = article.title || '';
        quill.root.innerHTML = article.content || '';
        document.getElementById('cms-image').value = article.image || '';
        document.getElementById('cms-status').value = article.status || 'publish';
        document.getElementById('cms-date').value = article.created_at || '';
        
        // Update UI ke mode edit
        document.getElementById('artikel-form-title').innerHTML = '✏️ Edit Artikel';
        document.getElementById('artikel-edit-id').textContent = article.id;
        document.getElementById('artikel-edit-indicator').classList.remove('hidden');
        
        // Scroll ke form
        document.getElementById('cms-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        showToast('✏️ Mode edit artikel aktif');
    }

    // CANCEL EDIT ARTIKEL
    function cancelEditArtikel() {
        document.getElementById('cms-id').value = '';
        document.getElementById('cms-title').value = '';
        quill.root.innerHTML = '';
        document.getElementById('cms-image').value = '';
        document.getElementById('cms-status').value = 'publish';
        document.getElementById('cms-date').value = '';
        
        document.getElementById('artikel-form-title').innerHTML = '➕ Tambah Artikel Baru';
        document.getElementById('artikel-edit-indicator').classList.add('hidden');
    }

    // SUBMIT ARTIKEL (Tambah / Edit)
    document.getElementById('cms-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const id = document.getElementById('cms-id').value;
        const title = document.getElementById('cms-title').value.trim();
        const content = quill.root.innerHTML;
        const image = document.getElementById('cms-image').value.trim();
        const status = document.getElementById('cms-status').value;
        let date = document.getElementById('cms-date').value.trim();
        
        if (!title || !content || content === '<p><br></p>') {
            alert('Judul dan konten harus diisi!');
            return;
        }
        
        if (!date) {
            const today = new Date();
            date = today.getFullYear() + '-' + 
                   String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(today.getDate()).padStart(2, '0');
        }
        
        const submitBtn = document.getElementById('cms-submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        
        try {
            const payload = {
                type: 'artikel',
                title: title,
                content: content,
                image: image,
                status: status,
                created_at: date
            };
            
            // Jika ada ID, berarti EDIT
            if (id) {
                payload.action = 'update';
                payload.id = id;
            }
            
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            showToast(id ? '✅ Artikel berhasil diperbarui!' : '✅ Artikel berhasil ditambahkan!');
            cancelEditArtikel();
            
            setTimeout(() => {
                loadArticles();
            }, 1500);
            
        } catch (error) {
            console.error('Error saving article:', error);
            showToast('❌ Gagal menyimpan artikel.');
        }
        
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Artikel';
    });

    // RESET FORM ARTIKEL
    document.getElementById('cms-clear-btn').addEventListener('click', function() {
        if (confirm('Reset form artikel?')) {
            cancelEditArtikel();
        }
    });

    // TOMBOL HARI INI
    document.getElementById('cms-date-today').addEventListener('click', function() {
        const today = new Date();
        const dateStr = today.getFullYear() + '-' + 
                        String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                        String(today.getDate()).padStart(2, '0');
        document.getElementById('cms-date').value = dateStr;
    });

    // HAPUS ARTIKEL
    async function deleteArticle(id) {
        if (!confirm('Yakin ingin menghapus artikel #' + id + '? Tindakan ini tidak bisa dibatalkan.')) {
            return;
        }
        
        try {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'delete',
                    type: 'artikel',
                    id: id
                })
            });
            
            showToast('✅ Artikel berhasil dihapus!');
            
            setTimeout(() => {
                loadArticles();
            }, 1500);
            
        } catch (error) {
            console.error('Error deleting article:', error);
            showToast('❌ Gagal menghapus artikel.');
        }
    }

    // ============================================================
    // ============ PRODUK ========================================
    // ============================================================

    async function loadProducts() {
        const listContainer = document.getElementById('cms-produk-list');
        listContainer.innerHTML = '<p class="text-gray-400 text-sm">Memuat data...</p>';
        
        try {
            const response = await fetch(API_URL + '?type=produk');
            if (!response.ok) throw new Error('Gagal memuat data');
            const products = await response.json();
            cacheProducts = products;
            
            if (products.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-400 text-sm">Belum ada produk.</p>';
                return;
            }
            
            let html = '';
            products.forEach((produk, index) => {
                const statusColor = produk.status === 'publish' ? 'green' : 'yellow';
                const statusText = produk.status === 'publish' ? 'Published' : 'Draft';
                const kategoriColor = produk.kategori === 'Mesin' ? 'blue' : 'purple';
                const produkId = produk.id || index + 1;
                
                let hargaText = 'Hubungi Kami';
                if (produk.harga && produk.harga !== 'Hubungi Kami' && !isNaN(produk.harga)) {
                    hargaText = 'Rp ' + Number(produk.harga).toLocaleString('id-ID');
                } else if (produk.harga && produk.harga !== 'Hubungi Kami') {
                    hargaText = produk.harga;
                }
                
                html += `
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100 hover:border-green-200 transition-colors">
                        <div class="flex items-center gap-3 flex-1 min-w-0">
                            <div class="w-16 h-16 rounded-lg bg-gray-200 flex-shrink-0 overflow-hidden">
                                <img src="${produk.gambar || 'https://via.placeholder.com/100'}" class="w-full h-full object-cover" alt="${produk.nama}">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xs font-bold text-gray-400">#${produkId}</span>
                                    <span class="text-sm font-semibold text-gray-800 truncate">${produk.nama || 'Tanpa Nama'}</span>
                                    <span class="px-2 py-0.5 text-xs rounded-full bg-${kategoriColor}-100 text-${kategoriColor}-700 font-medium">${produk.kategori || '-'}</span>
                                </div>
                                <div class="text-xs text-gray-400 truncate mt-0.5">${produk.deskripsi || '(tanpa deskripsi)'}</div>
                                <div class="text-xs font-bold text-green-700 mt-0.5">${hargaText}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0 ml-4">
                            <span class="px-2 py-0.5 text-xs rounded-full bg-${statusColor}-100 text-${statusColor}-700 font-medium">${statusText}</span>
                            <button onclick="editProduk('${produkId}')" class="text-blue-400 hover:text-blue-600 transition-colors text-sm" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteProduk('${produkId}')" class="text-red-400 hover:text-red-600 transition-colors text-sm" title="Hapus">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            listContainer.innerHTML = html;
            
        } catch (error) {
            console.error('Error loading products:', error);
            listContainer.innerHTML = '<p class="text-red-500 text-sm">❌ Gagal memuat data produk.</p>';
        }
    }

    // EDIT PRODUK - Isi form dengan data yang ada
    function editProduk(id) {
        const produk = cacheProducts.find(p => String(p.id) === String(id));
        if (!produk) {
            showToast('❌ Produk tidak ditemukan');
            return;
        }
        
        document.getElementById('produk-id').value = produk.id;
        document.getElementById('produk-nama').value = produk.nama || '';
        document.getElementById('produk-kategori').value = produk.kategori || 'Mesin';
        document.getElementById('produk-harga').value = (produk.harga && !isNaN(produk.harga)) ? produk.harga : '';
        document.getElementById('produk-gambar').value = produk.gambar || '';
        document.getElementById('produk-deskripsi').value = produk.deskripsi || '';
        document.getElementById('produk-status').value = produk.status || 'publish';
        
        document.getElementById('produk-form-title').innerHTML = '✏️ Edit Produk';
        document.getElementById('produk-edit-id').textContent = produk.id;
        document.getElementById('produk-edit-indicator').classList.remove('hidden');
        
        document.getElementById('produk-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        showToast('✏️ Mode edit produk aktif');
    }

    // CANCEL EDIT PRODUK
    function cancelEditProduk() {
        document.getElementById('produk-id').value = '';
        document.getElementById('produk-nama').value = '';
        document.getElementById('produk-kategori').value = 'Mesin';
        document.getElementById('produk-harga').value = '';
        document.getElementById('produk-gambar').value = '';
        document.getElementById('produk-deskripsi').value = '';
        document.getElementById('produk-status').value = 'publish';
        
        document.getElementById('produk-form-title').innerHTML = '➕ Tambah Produk Baru';
        document.getElementById('produk-edit-indicator').classList.add('hidden');
    }

    // SUBMIT PRODUK (Tambah / Edit)
    document.getElementById('produk-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const id = document.getElementById('produk-id').value;
        const nama = document.getElementById('produk-nama').value.trim();
        const kategori = document.getElementById('produk-kategori').value;
        const harga = document.getElementById('produk-harga').value.trim();
        const gambar = document.getElementById('produk-gambar').value.trim();
        const deskripsi = document.getElementById('produk-deskripsi').value.trim();
        const status = document.getElementById('produk-status').value;
        
        if (!nama) {
            alert('Nama produk harus diisi!');
            return;
        }
        
        const submitBtn = document.getElementById('produk-submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        
        try {
            const payload = {
                type: 'produk',
                nama: nama,
                kategori: kategori,
                harga: harga || 'Hubungi Kami',
                deskripsi: deskripsi,
                gambar: gambar,
                status: status
            };
            
            // Jika ada ID, berarti EDIT
            if (id) {
                payload.action = 'update';
                payload.id = id;
            }
            
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            showToast(id ? '✅ Produk berhasil diperbarui!' : '✅ Produk berhasil ditambahkan!');
            cancelEditProduk();
            
            setTimeout(() => {
                loadProducts();
            }, 1500);
            
        } catch (error) {
            console.error('Error saving product:', error);
            showToast('❌ Gagal menyimpan produk.');
        }
        
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Produk';
    });

    // RESET FORM PRODUK
    document.getElementById('produk-clear-btn').addEventListener('click', function() {
        if (confirm('Reset form produk?')) {
            cancelEditProduk();
        }
    });

    // HAPUS PRODUK
    async function deleteProduk(id) {
        if (!confirm('Yakin ingin menghapus produk #' + id + '? Tindakan ini tidak bisa dibatalkan.')) {
            return;
        }
        
        try {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'delete',
                    type: 'produk',
                    id: id
                })
            });
            
            showToast('✅ Produk berhasil dihapus!');
            
            setTimeout(() => {
                loadProducts();
            }, 1500);
            
        } catch (error) {
            console.error('Error deleting product:', error);
            showToast('❌ Gagal menghapus produk.');
        }
    }

    // ============================================================
    // LOAD SAAT HALAMAN DIBUKA
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        loadArticles();
    });
</script>

</body>
</html>
