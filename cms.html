<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS Artikel - Jalupang Teknik</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- ===== QUILL JS (Rich Text Editor) ===== -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <style>
        body { background: #f5f7fa; }
        .card { transition: all 0.3s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        /* ===== STYLING QUILL EDITOR ===== */
        #quill-editor {
            min-height: 250px;
            max-height: 400px;
            overflow-y: auto;
            background: white;
            border-radius: 0 0 0.5rem 0.5rem;
        }
        #quill-editor p {
            margin-bottom: 0.5rem;
        }
        #quill-editor ul, #quill-editor ol {
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
        }
        #quill-editor blockquote {
            border-left: 4px solid #22c55e;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #4b5563;
            background: #f0fdf4;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }
        .ql-toolbar {
            border-radius: 0.5rem 0.5rem 0 0;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-bottom: none;
        }
        .ql-container {
            border: 1px solid #e5e7eb;
            border-radius: 0 0 0.5rem 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .ql-editor {
            min-height: 200px;
        }
        .ql-editor strong { font-weight: 700; }
        .ql-editor em { font-style: italic; }
        .ql-editor u { text-decoration: underline; }
        .ql-editor strike { text-decoration: line-through; }
        .ql-editor .ql-align-center { text-align: center; }
        .ql-editor .ql-align-right { text-align: right; }
        .ql-editor .ql-align-justify { text-align: justify; }
    </style>
</head>
<body>

<div class="max-w-6xl mx-auto px-4 py-10">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">📝 CMS Artikel</h1>
            <p class="text-gray-500 text-sm">Kelola artikel untuk website Jalupang Teknik</p>
        </div>
        <div class="flex gap-3">
            <a href="index.html" class="text-green-600 hover:text-green-800 text-sm font-medium">
                <i class="fas fa-arrow-left"></i> Kembali ke Website
            </a>
        </div>
    </div>

    <!-- FORM TAMBAH ARTIKEL -->
    <div class="bg-white rounded-2xl shadow-md p-6 mb-8 card">
        <h2 class="text-xl font-bold text-gray-700 mb-4">➕ Tambah / Edit Artikel</h2>
        
        <form id="cms-form" class="space-y-4">
            <!-- Judul -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Judul Artikel *</label>
                <input type="text" id="cms-title" required 
                       class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none"
                       placeholder="Masukkan judul artikel..." />
            </div>
            
            <!-- Rich Text Editor (Quill) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Konten Artikel *</label>
                <div id="quill-editor"></div>
                <input type="hidden" id="cms-content" required />
            </div>
            
            <!-- Gambar -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">URL Gambar (opsional)</label>
                <input type="url" id="cms-image" 
                       class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none"
                       placeholder="https://example.com/gambar.jpg" />
            </div>
            
            <!-- Status & Tombol -->
            <div class="flex flex-wrap gap-4 items-center">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="cms-status" class="px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
                        <option value="publish">Publish</option>
                        <option value="draft">Draft</option>
                    </select>
                </div>
                
                <button type="submit" id="cms-submit-btn"
                        class="mt-6 px-6 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-all shadow-md hover:shadow-lg">
                    <i class="fas fa-save"></i> Simpan Artikel
                </button>
                
                <button type="button" id="cms-clear-btn"
                        class="mt-6 px-6 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition-all">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>
        </form>
        
        <div id="cms-success" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded-lg border border-green-200 text-sm">
            ✅ Artikel berhasil disimpan!
        </div>
        <div id="cms-error" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg border border-red-200 text-sm">
            ❌ Gagal menyimpan artikel. Periksa koneksi atau coba lagi.
        </div>
        <div id="cms-loading" class="hidden mt-4 p-3 bg-blue-100 text-blue-700 rounded-lg border border-blue-200 text-sm">
            ⏳ Menyimpan artikel...
        </div>
    </div>

    <!-- DAFTAR ARTIKEL -->
    <div class="bg-white rounded-2xl shadow-md p-6 card">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-700">📄 Daftar Artikel</h2>
            <button onclick="loadArticles()" class="text-sm text-green-600 hover:text-green-800 font-medium">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
        <div id="cms-article-list" class="space-y-3">
            <p class="text-gray-400 text-sm">Memuat data...</p>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbyQAKZs4rZouzb4TRyi6cWkFy2Mj5vIF4qlDdrzAu0HfqONxSp3Qo8YnpAQCaJ4WIBy/exec';

    // ============================================================
    // INISIALISASI QUILL RICH TEXT EDITOR
    // ============================================================
    var quill = new Quill('#quill-editor', {
        theme: 'snow',
        placeholder: 'Tulis konten artikel di sini...',
        modules: {
            toolbar: [
                [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['blockquote', 'code-block'],
                ['link', 'image', 'video'],
                ['clean']
            ]
        }
    });

    // ============================================================
    // AMBIL DAFTAR ARTIKEL
    // ============================================================
    async function loadArticles() {
        const listContainer = document.getElementById('cms-article-list');
        listContainer.innerHTML = '<p class="text-gray-400 text-sm">Memuat data...</p>';
        
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Gagal memuat data');
            const articles = await response.json();
            
            if (articles.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-400 text-sm">Belum ada artikel.</p>';
                return;
            }
            
            let html = '';
            articles.forEach((article, index) => {
                const statusColor = article.status === 'publish' ? 'green' : 'yellow';
                const statusText = article.status === 'publish' ? 'Published' : 'Draft';
                const contentPreview = article.content ? article.content.replace(/<[^>]*>/g, '').substring(0, 80) + '...' : '(kosong)';
                
                html += `
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100 hover:border-green-200 transition-colors">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-gray-400">#${article.id || index + 1}</span>
                                <span class="text-sm font-semibold text-gray-800 truncate">${article.title || 'Tanpa Judul'}</span>
                            </div>
                            <div class="text-xs text-gray-400 truncate mt-0.5">${contentPreview}</div>
                        </div>
                        <div class="flex items-center gap-3 flex-shrink-0 ml-4">
                            <span class="px-2 py-0.5 text-xs rounded-full bg-${statusColor}-100 text-${statusColor}-700 font-medium">${statusText}</span>
                            <button onclick="editArticle('${article.id || index + 1}')" class="text-blue-400 hover:text-blue-600 transition-colors text-sm" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteArticle('${article.id || index + 1}')" class="text-red-400 hover:text-red-600 transition-colors text-sm" title="Hapus">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            listContainer.innerHTML = html;
            
        } catch (error) {
            console.error('Error loading articles:', error);
            listContainer.innerHTML = '<p class="text-red-500 text-sm">❌ Gagal memuat data artikel.</p>';
        }
    }

    // ============================================================
    // SIMPAN ARTIKEL BARU
    // ============================================================
    document.getElementById('cms-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const title = document.getElementById('cms-title').value.trim();
        const content = quill.root.innerHTML; // Ambil HTML dari Quill
        const image = document.getElementById('cms-image').value.trim();
        const status = document.getElementById('cms-status').value;
        
        if (!title || !content || content === '<p><br></p>') {
            alert('Judul dan konten harus diisi!');
            return;
        }
        
        const submitBtn = document.getElementById('cms-submit-btn');
        const loadingDiv = document.getElementById('cms-loading');
        const successDiv = document.getElementById('cms-success');
        const errorDiv = document.getElementById('cms-error');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        loadingDiv.classList.remove('hidden');
        successDiv.classList.add('hidden');
        errorDiv.classList.add('hidden');
        
        try {
            const payload = { title, content, image, status };
            
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            loadingDiv.classList.add('hidden');
            successDiv.classList.remove('hidden');
            
            // Reset form
            document.getElementById('cms-title').value = '';
            quill.root.innerHTML = '';
            document.getElementById('cms-image').value = '';
            document.getElementById('cms-status').value = 'publish';
            
            // Refresh daftar artikel
            setTimeout(() => {
                loadArticles();
                successDiv.classList.add('hidden');
            }, 2000);
            
        } catch (error) {
            console.error('Error saving article:', error);
            loadingDiv.classList.add('hidden');
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 4000);
        }
        
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Artikel';
    });

    // ============================================================
    // RESET FORM
    // ============================================================
    document.getElementById('cms-clear-btn').addEventListener('click', function() {
        if (confirm('Reset form? Semua data yang belum disimpan akan hilang.')) {
            document.getElementById('cms-title').value = '';
            quill.root.innerHTML = '';
            document.getElementById('cms-image').value = '';
            document.getElementById('cms-status').value = 'publish';
            document.getElementById('cms-success').classList.add('hidden');
            document.getElementById('cms-error').classList.add('hidden');
        }
    });

    // ============================================================
    // EDIT ARTIKEL (Placeholder)
    // ============================================================
    function editArticle(id) {
        alert(`Fungsi edit untuk artikel #${id} akan segera tersedia.\n\nUntuk sekarang, edit langsung di Google Sheets.`);
        window.open('https://docs.google.com/spreadsheets/d/1RfUDGqz6Rtvnka0FaflJ99C5U5n72e0WfzJT5WTW9qc/edit', '_blank');
    }

    // ============================================================
    // HAPUS ARTIKEL (Placeholder)
    // ============================================================
    function deleteArticle(id) {
        if (confirm(`Yakin ingin menghapus artikel #${id}?`)) {
            alert(`Fungsi hapus untuk artikel #${id} akan segera tersedia.\n\nUntuk sekarang, hapus manual di Google Sheets.`);
            window.open('https://docs.google.com/spreadsheets/d/1RfUDGqz6Rtvnka0FaflJ99C5U5n72e0WfzJT5WTW9qc/edit', '_blank');
        }
    }

    // ============================================================
    // LOAD SAAT HALAMAN DIBUKA
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        loadArticles();
    });
</script>

</body>
</html>
